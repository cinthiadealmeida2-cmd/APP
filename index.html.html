.tools{display:flex;gap:6px}
button{font:inherit;color:inherit;cursor:pointer}
.tb{font:400 .66rem Jost,sans-serif;letter-spacing:.14em;text-transform:uppercase;background:none;border:1px solid var(--line);padding:6px 10px;min-height:34px}
.tb[aria-pressed=true],.on{background:var(--ink);color:var(--bg)}
.btn{display:block;width:100%;background:var(--ink);color:var(--bg);border:0;padding:14px;font:400 .72rem Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase;min-height:48px}

.btn:disabled{opacity:.45}
main{padding:20px}
h1{font-weight:300;font-size:2rem;line-height:1.15;margin:0 0 6px}
h2{font-weight:300;font-size:1.25rem;margin:26px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
.card{border:1px solid var(--line);background:var(--paper);padding:16px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center}
.ph{background:linear-gradient(160deg,var(--p1),var(--p2)) center/cover;min-height:170px;display:flex;align-items:flex-end;padding:12px;color:#f2f0eb;margin-bottom:12px}
.ph .lbl{color:#f2f0eb}.ph.sm{min-height:110px}
.edit .ph{cursor:pointer;outline:2px dashed var(--acc);outline-offset:-6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.chip{flex:0 0 auto;border:1px solid var(--line);background:none;padding:8px 14px;min-height:40px;font:400 .72rem Jost,sans-serif;letter-spacing:.14em;text-transform:uppercase}
.big{font-weight:200;font-size:2.8rem;line-height:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{text-align:left;border:1px solid var(--line);background:var(--paper);padding:16px;min-height:84px}
input{max-width:100%;min-width:0}.chip.on{background:var(--ink);color:var(--bg)}input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);padding:11px;margin:4px 0 12px;min-height:44px}
label{display:block}
.chk{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.chk input{width:22px;height:22px;margin:0;min-height:0}
.x{background:none;border:0;color:var(--mute);font-size:1.2rem;min-width:36px;min-height:36px;display:none}
.edit .x{display:inline-block}
.edit [data-p]{outline:1px dashed var(--line);outline-offset:3px;min-width:2ch;display:inline-block}
.hide-e{display:block}.edit .hide-e{display:none}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--bg);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav button{background:none;border:0;padding:16px 0 14px;font:400 .62rem Jost,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);min-height:52px}
nav button[aria-current=page]{color:var(--ink);box-shadow:inset 0 2px 0 var(--ink)}
details{border:1px solid var(--line);background:var(--paper);margin-bottom:12px}
summary{padding:16px;font-weight:400;cursor:pointer;min-height:48px}
details>div{padding:0 16px 16px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;overflow:auto;padding:0 12px}#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;font-size:.85rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:90%}
#toast.s{opacity:1}
svg.w{width:100%;height:36px;margin:14px 0}
svg.w path{fill:none;stroke:var(--ink);stroke-width:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
